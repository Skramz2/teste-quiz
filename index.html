function ranking(scores){
  const arr = Object.entries(scores||{}).map(([id,v]) => ({id, name:v.name||'?', score:v.score||0}))

  const pre = (new URLSearchParams(location.search).get('sala') || '').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
  const sv = lsGet('quizia_player');
  if (sv && sv.code && (!pre || pre === sv.code)) {
    try { const s = await get(ref(db, `rooms/${sv.code}/players/${uid}`)); if (s.exists()) return startPlayer(sv.code, s.val().name); } catch(e){}
  }
  let resume = null;
  const hs = lsGet('quizia_host');
  if (hs && hs.code && !pre) {
    try { const m = await get(ref(db, `rooms/${hs.code}/meta/hostUid`)); if (m.val() === uid) resume = hs.code; } catch(e){}
  }
  app.innerHTML = `<main class="home">
    <div class="hero"><div class="brand">${LOGO}<span>QuizIA</span></div><p>Quiz ao vivo sobre inteligência artificial. Todo mundo joga pelo celular.</p></div>
    <div class="homegrid">
      <section class="panel"><h2>Entrar em uma sala</h2>
        <label for="codeIn">Código da sala</label><input id="codeIn" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="ABC12" value="${esc(pre)}">
        <label for="nickIn">Seu apelido</label><input id="nickIn" type="text" maxlength="20" autocomplete="off" placeholder="Como quer aparecer?" value="${esc((sv&&sv.name)||'')}">
        <button id="joinBtn" class="btn">Entrar no jogo</button><p id="joinErr" class="err"></p></section>
      ${pre ? '' : `<section class="panel"><h2>Apresentar um quiz</h2><p style="color:var(--mut)">Crie uma sala, mostre o QR code no projetor e conduza as ${QUIZ.length} perguntas.</p>
        <button id="createBtn" class="btn green">Criar sala</button>
        ${resume ? `<button id="resumeBtn" class="btn ghost">Retomar sala ${esc(resume)}</button>` : ''}<p id="createErr" class="err"></p></section>`}
    </div></main>`;
  if (pre) $('nickIn').focus();
  $('joinBtn').onclick = async () => {
    const code = $('codeIn').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
    const name = $('nickIn').value.trim();
    const err = $('joinErr'); err.textContent = '';
    if (code.length < 4) return err.textContent = 'Digite o código da sala.';
    if (!name) return err.textContent = 'Digite um apelido.';
    $('joinBtn').disabled = true;
    try {
      const m = await get(ref(db, `rooms/${code}/meta/hostUid`));
      if (!m.exists()) { err.textContent = 'Sala não encontrada. Confira o código.'; $('joinBtn').disabled = false; return; }
      await set(ref(db, `rooms/${code}/players/${uid}`), { name, joinedAt: serverTimestamp() });
      startPlayer(code, name);
    } catch(e) { err.textContent = 'Não foi possível entrar: ' + (e.code || e.message); $('joinBtn').disabled = false; }
  };
  if ($('createBtn')) $('createBtn').onclick = createRoom;
  if ($('resumeBtn')) $('resumeBtn').onclick = () => startHost(resume);
}

/* ===================== APRESENTADOR ===================== */
async function createRoom(){
  const btn = $('createBtn'); btn.disabled = true; $('createErr').textContent = '';
  const keys = {};
  QUIZ.forEach((q,i) => { keys['q'+i] = { c: q.correct, e: q.explain }; });   // gabarito privado (só o apresentador lê)
  try {
    for (let n = 0; n < 10; n++) {
      let code = ''; for (let i = 0; i < 5; i++) code += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
      if ((await get(ref(db, `rooms/${code}/meta/hostUid`))).exists()) continue;
      try {
        await set(ref(db, `rooms/${code}`), {
          meta: { hostUid: uid, createdAt: serverTimestamp(), total: QUIZ.length },
          state: { phase: 'lobby', qIndex: -1, total: QUIZ.length },
          keys
        });
        return startHost(code);
      } catch(e) { if (e.code !== 'PERMISSION_DENIED' && !String(e.message).includes('PERMISSION_DENIED')) throw e; }
    }
    throw new Error('Não consegui gerar um código livre. Tente de novo.');
  } catch(e) {
    $('createErr').textContent = 'Erro ao criar sala: ' + (e.code || e.message) + ' (confira as regras do banco).';
    btn.disabled = false;
  }
}

function startHost(code){
  H = { code, state: null, players: {}, presence: {}, scores: {}, answers: {}, ansKey: null, ansUn: null, closing: false, times: {},
        link: location.href.split('#')[0].split('?')[0] + '?sala=' + code };
  lsSet('quizia_host', { code });
  const R = p => ref(db, `rooms/${code}/${p}`);
  onValue(R('state'), s => {
    const prev = H.state && H.state.phase;
    H.state = s.val() || { phase: 'lobby', qIndex: -1, total: QUIZ.length };
    if (H.state.phase !== 'question') H.closing = false;
    if ((H.state.qKey || null) !== H.ansKey) {
      if (H.ansUn) H.ansUn();
      H.ansKey = H.state.qKey || null; H.answers = {};
      H.ansUn = H.ansKey ? onValue(R('answers/' + H.ansKey), a => { H.answers = a.val() || {}; fillAnswered(); fillBars(); }) : null;
    }
    renderHost();
  });
  onValue(R('players'), s => { H.players = s.val() || {}; fillPlayers(); fillAnswered(); });
  onValue(R('presence'), s => { H.presence = s.val() || {}; fillPlayers(); });
  onValue(R('scores'), s => { H.scores = s.val() || {}; fillRank(); if (H.state && H.state.phase === 'final') renderHost(); });
  renderHost();
}

function nextIndex(){ const st = H.state; return (st && st.qIndex != null ? st.qIndex : -1) + 1; }
function timeBox(idx){
  const q = QUIZ[idx]; const v = H.times[idx] || q.time;
  return `<label>Tempo da pergunta ${idx+1}<input id="timeIn" type="number" min="5" max="180" value="${v}"> s</label>`;
}
function readTime(idx){ const v = clamp(parseInt(($('timeIn')||{}).value,10) || QUIZ[idx].time, 5, 180); H.times[idx] = v; return v; }

function renderHost(){
  if (!H || !H.state) return;
  const st = H.state, ph = st.phase;
  const top = `<div class="htop"><div class="brand">${LOGO}<span>QuizIA</span></div>
    <div class="right"><span class="pill">Sala <b>${esc(H.code)}</b></span><button id="resetBtn" class="btn ghost">Reiniciar partida</button></div></div>`;
  let body = '';
  if (ph === 'lobby') {
    const idx = nextIndex();
    body = `<div class="hgrid">
      <section class="panel" style="text-align:center"><h2>Entre pelo celular</h2>
        <p style="color:var(--mut)">Aponte a câmera para o QR code ou abra o link e digite o código</p>
        <div class="qrbox"><div id="qr"></div></div>
        <div class="codebig">${[...H.code].map(c=>`<span>${esc(c)}</span>`).join('')}</div>
        <div class="linkrow"><input id="linkTxt" type="text" readonly value="${esc(H.link)}" aria-label="Link da sala"><button id="copyBtn" class="btn">Copiar link</button></div></section>
      <section class="panel"><div class="phead"><h2>Jogadores</h2><span class="count"><b id="hCount">0</b> conectados</span></div>
        <div id="hPlayers" class="chips"></div>
        <div class="startbar">${timeBox(idx)}<button id="startBtn" class="btn big green">Iniciar quiz</button></div></section></div>`;
  } else if (ph === 'final') {
    const rk = ranking(H.scores), tp = rk.slice(0,3);
    const col = (p,cls) => p ? `<div class="pcol ${cls}"><div class="nm">${esc(p.name)}</div><div class="bar">${p.rank}º<small>${p.score} pts</small></div></div>` : '';
    body = `<section class="panel" style="text-align:center"><h1 style="font-size:clamp(2rem,4vw,3.6rem)">Pódio final</h1>
      ${rk.length ? `<div class="podium">${col(tp[1],'p2')}${col(tp[0],'p1')}${col(tp[2],'p3')}</div>` : '<p>Nenhum jogador pontuou.</p>'}
      ${rk.length > 3 ? `<ul class="rank" style="max-width:560px;margin:0 auto;text-align:left">${rk.slice(3).map(p=>`<li><span class="pos">${p.rank}</span>${esc(p.name)}<b>${p.score}</b></li>`).join('')}</ul>` : ''}
      <div class="controls" style="justify-content:center"><button id="resetBtn2" class="btn big">Jogar de novo</button></div></section>`;
  } else {
    const q = st.question, rv = st.reveal;
    const tiles = q.options.map((o,i) => `<div class="tile o${i}${rv ? (i === rv.c ? ' right' : ' dim') : ''}"><span class="let">${LETTERS[i]}</span><span class="otxt">${esc(o)}</span><span class="cnt" id="cnt${i}"></span><i class="fill" id="fill${i}"></i></div>`).join('');
    let ctr = '';
    if (ph === 'question') ctr = `<button id="closeBtn" class="btn big red">Encerrar rodada</button>`;
    else if (ph === 'closed') ctr = `<button id="revealBtn" class="btn big green">Revelar resposta</button>`;
    else { const n = nextIndex(); ctr = n < QUIZ.length ? `${timeBox(n)}<button id="nextBtn" class="btn big">Próxima pergunta</button>` : `<button id="finalBtn" class="btn big green">Ver pódio</button>`; }
    body = `<div class="qlayout"><section>
      <div class="qtop"><span class="pill">Pergunta ${st.qIndex+1} de ${st.total}</span><div class="timer" id="hTimer">${ph==='question'?st.duration:'⏱'}</div></div>
      <div class="tbar"><i id="hTbar" style="width:${ph==='question'?100:0}%"></i></div>
      <h1 class="qtext">${esc(q.text)}</h1><div class="ogrid">${tiles}</div>
      ${rv ? `<div class="expl"><b>Resposta certa: ${LETTERS[rv.c]}.</b> ${esc(rv.e)}</div>` : ''}
      <div class="controls">${ctr}</div></section>
      <aside class="panel side"><h3>Respostas</h3><div id="hAnswered" class="bignum">0</div><p style="color:var(--mut);margin-bottom:1.2rem">jogadores que responderam</p>
      <h3>Ranking</h3><ol id="hRank" class="rank"></ol></aside></div>`;
  }
  app.innerHTML = `<div class="host">${top}${body}</div>`;
  const on = (id, fn) => { const e = $(id); if (e) e.onclick = fn; };
  on('resetBtn', resetGame); on('resetBtn2', resetGame);
  on('copyBtn', copyLink); on('startBtn', () => startQuestion(nextIndex()));
  on('nextBtn', () => startQuestion(nextIndex())); on('closeBtn', closeRound);
  on('revealBtn', revealAnswer); on('finalBtn', () => update(ref(db, `rooms/${H.code}/state`), { phase: 'final' }));
  if (ph === 'lobby') makeQR();
  fillPlayers(); fillAnswered(); fillBars(); fillRank();
}

function makeQR(){
  const box = $('qr'); if (!box) return;
  if (typeof QRCode === 'undefined') { box.textContent = 'QR indisponível: use o link abaixo.'; return; }
  new QRCode(box, { text: H.link, width: 230, height: 230, colorDark: '#0e0f2e', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
}
async function copyLink(){
  try { await navigator.clipboard.writeText(H.link); toast('Link copiado!'); }
  catch(e) { const i = $('linkTxt'); i.select(); document.execCommand('copy'); toast('Link copiado!'); }
}
function fillPlayers(){
  if (!H) return;
  const ids = Object.keys(H.players);
  const online = ids.filter(i => H.presence[i]).length;
  if ($('hCount')) $('hCount').textContent = online;
  const box = $('hPlayers'); if (!box) return;
  box.innerHTML = ids.length ? ids.sort((a,b)=>(H.players[a].name||'').localeCompare(H.players[b].name||''))
    .map(i => `<span class="chip${H.presence[i]?'':' off'}"><i></i>${esc(H.players[i].name)}</span>`).join('')
    : '<p style="color:var(--mut)">Aguardando jogadores…</p>';
}
function answeredCount(){ return Object.keys(H.answers).filter(i => H.players[i]).length; }
function fillAnswered(){
  const e = $('hAnswered'); if (!e || !H) return;
  e.textContent = `${answeredCount()} / ${Object.keys(H.players).length}`;
}
function currentDist(){
  if (H.state.reveal) return H.state.reveal.dist || [0,0,0,0];
  const d = [0,0,0,0]; Object.entries(H.answers).forEach(([i,a]) => { if (H.players[i] && a.c >= 0 && a.c <= 3) d[a.c]++; }); return d;
}
function fillBars(){
  if (!H || !H.state || !H.state.question || H.state.phase === 'question') return;
  const d = currentDist(), tot = Math.max(1, d.reduce((a,b)=>a+b,0));
  d.forEach((n,i) => { if ($('cnt'+i)) { $('cnt'+i).textContent = n; $('fill'+i).style.width = (n/tot*100) + '%'; } });
}
function fillRank(){
  const e = $('hRank'); if (!e || !H) return;
  const rk = ranking(H.scores).slice(0,5);
  e.innerHTML = rk.length ? rk.map(p => `<li><span class="pos">${p.rank}</span>${esc(p.name)}<b>${p.score}</b></li>`).join('') : '<li style="color:var(--mut)">O ranking aparece após a primeira revelação.</li>';
}

async function startQuestion(i){
  if (i >= QUIZ.length) return;
  const q = QUIZ[i], dur = readTime(i), start = now();
  try {
    await set(ref(db, `rooms/${H.code}/state`), {
      phase: 'question', qIndex: i, qKey: 'q' + i, total: QUIZ.length, startedAt: start, endsAt: start + dur*1000, duration: dur,
      question: { text: q.text, options: q.options }          // sem a resposta certa
    });
  } catch(e) { toast('Erro ao iniciar: ' + (e.code || e.message)); }
}
async function closeRound(){
  if (!H || H.state.phase !== 'question') return;
  try { await update(ref(db, `rooms/${H.code}/state`), { phase: 'closed' }); } catch(e) { toast('Erro: ' + (e.code || e.message)); }
}
async function revealAnswer(){
  const st = H.state; if (st.phase !== 'closed') return;
  $('revealBtn').disabled = true;
  const k = st.qKey, B = `rooms/${H.code}/`;
  try {
    const [ks, as, rs, ss] = await Promise.all([get(ref(db, B+'keys/'+k)), get(ref(db, B+'answers/'+k)), get(ref(db, B+'results/'+k)), get(ref(db, B+'scores'))]);
    const key = ks.val(), answers = as.val() || {}, prevRes = rs.val() || {}, scores = ss.val() || {};
    const dist = [0,0,0,0], upd = {}; let answered = 0;
    for (const [id, pl] of Object.entries(H.players)) {
      const a = answers[id]; let pts = 0, ok = false, c = -1;
      if (a && a.c >= 0 && a.c <= 3) {
        c = a.c; dist[c]++; answered++;
        if (c === key.c) { ok = true; const el = clamp(a.t - st.startedAt, 0, st.duration*1000); pts = Math.round(1000 * (1 - 0.5 * el / (st.duration*1000))); }
      }
      const base = ((scores[id] && scores[id].score) || 0) - ((prevRes[id] && prevRes[id].pts) || 0);   // evita somar duas vezes
      upd['results/'+k+'/'+id] = { c, ok, pts };
      upd['scores/'+id] = { name: pl.name, score: base + pts };
    }
    upd['state/reveal'] = { c: key.c, e: key.e, dist, answered };
    upd['state/phase'] = 'revealed';
    await update(ref(db, `rooms/${H.code}`), upd);
  } catch(e) { toast('Erro ao revelar: ' + (e.code || e.message)); const b = $('revealBtn'); if (b) b.disabled = false; }
}
async function resetGame(){
  if (!confirm('Reiniciar a partida? Pontuações e respostas serão apagadas (os jogadores continuam na sala).')) return;
  try { await update(ref(db, `rooms/${H.code}`), { answers: null, results: null, scores: null, state: { phase: 'lobby', qIndex: -1, total: QUIZ.length } }); }
  catch(e) { toast('Erro: ' + (e.code || e.message)); }
}

/* ===================== PARTICIPANTE ===================== */
function startPlayer(code, name){
  P = { code, name, state: null, scores: {}, choice: null, ans: null, res: null, qKey: null, un: [], expired: false, err: '' };
  lsSet('quizia_player', { code, name });
  const R = p => ref(db, `rooms/${code}/${p}`);
  onValue(ref(db, '.info/connected'), s => {
    if (s.val()) { const pr = R('presence/' + uid); onDisconnect(pr).remove(); set(pr, true).catch(()=>{}); }
  });
  onValue(R('state'), s => {
    const st = s.val(); P.state = st;
    const k = st && st.qKey || null;
    if (k !== P.qKey) {
      P.un.forEach(f => f()); P.un = []; P.qKey = k; P.choice = null; P.ans = null; P.res = null; P.expired = false; P.err = '';
      if (k) {
        P.un.push(onValue(R(`answers/${k}/${uid}`), a => { P.ans = a.val(); renderPlayer(); }));
        P.un.push(onValue(R(`results/${k}/${uid}`), r => { P.res = r.val(); renderPlayer(); }));
      }
    }
    renderPlayer();
  });
  onValue(R('scores'), s => { P.scores = s.val() || {}; renderPlayer(); });
  renderPlayer();
}

function myAnswer(){ return P.ans ? P.ans.c : (P.choice != null ? P.choice : null); }
async function submitAnswer(c){
  const st = P.state; if (!st || st.phase !== 'question' || myAnswer() != null) return;
  P.choice = c; P.err = ''; renderPlayer();
  try { await set(ref(db, `rooms/${P.code}/answers/${st.qKey}/${uid}`), { c, t: serverTimestamp() }); }
  catch(e) { P.choice = null; P.err = 'Sua resposta não foi aceita: o tempo acabou ou já havia uma resposta.'; renderPlayer(); }
}
function myRank(){ const rk = ranking(P.scores); const me = rk.find(p => p.id === uid); return { me, total: rk.length }; }

function renderPlayer(){
  if (!P) return;
  const st = P.state, ph = st && st.phase;
  const rk = myRank(), score = rk.me ? rk.me.score : 0;
  const top = `<div class="ptop"><div class="brand" style="font-size:1.2rem">${LOGO}<span>QuizIA</span></div><span class="pill nick">${esc(P.name)}</span></div>`;
  let body = '';
  if (!st) body = `<div class="center"><div class="em">🔌</div><h2>Sala indisponível</h2><p>O apresentador pode ter encerrado a sala.</p></div>`;
  else if (ph === 'lobby') body = `<div class="center"><div class="em">🙌</div><h2>Você está na sala!</h2><p style="color:var(--mut)">Aguarde o apresentador iniciar o quiz</p><p class="dots" style="margin-top:1rem"><span></span><span></span><span></span></p></div>`;
  else if (ph === 'question' || ph === 'closed') {
    const mine = myAnswer(), open = ph === 'question' && mine == null && !P.expired;
    const tiles = st.question.options.map((o,i) => `<button class="tile o${i}${mine===i?' picked':''}" data-c="${i}" ${open?'':'disabled'} style="${!open && mine!=null && mine!==i ? 'opacity:.45' : ''}"><span class="let">${LETTERS[i]}</span><span class="otxt">${esc(o)}</span></button>`).join('');
    let note = '';
    if (P.err) note = `<p class="err">${esc(P.err)}</p>`;
    else if (mine != null && ph === 'question') note = `<p style="text-align:center;font-weight:700;color:var(--d)">✔ Resposta enviada! Aguarde o fim do tempo.</p>`;
    else if (mine == null && (ph === 'closed' || P.expired)) note = `<p style="text-align:center;font-weight:700;color:#ffb020">⏰ Tempo esgotado. Você não respondeu.</p>`;
    else if (ph === 'closed') note = `<p style="text-align:center;font-weight:700;color:var(--cyan)">Rodada encerrada. Aguardando a correção…</p>`;
    body = `<div class="qtop" style="margin:0"><span class="pill">${st.qIndex+1}/${st.total}</span><b id="pTimer" class="disp" style="font-size:2rem">${ph==='question'?st.duration:''}</b></div>
      <div class="tbar" style="margin:0"><i id="pBar" style="width:${ph==='question'?100:0}%"></i></div>
      <div class="pq">${esc(st.question.text)}</div><div class="ogrid">${tiles}</div>${note}`;
  } else if (ph === 'revealed') {
    const rv = st.reveal, r = P.res || { c: -1, ok: false, pts: 0 };
    const verdict = r.ok ? `<div class="res ok"><div style="font-size:2.4rem">🎉</div><h2>Acertou!</h2><div class="pts">+${r.pts}</div></div>`
      : `<div class="res no"><div style="font-size:2.4rem">${r.c < 0 ? '⏰' : '😅'}</div><h2>${r.c < 0 ? 'Sem resposta' : 'Não foi dessa vez'}</h2><div class="pts">+0</div>${r.c >= 0 ? `<p>Você marcou ${LETTERS[r.c]}.</p>` : ''}</div>`;
    body = `<div class="pq">${esc(st.question.text)}</div>${verdict}
      <div class="panel"><b>Resposta certa: ${LETTERS[rv.c]}</b> – ${esc(st.question.options[rv.c])}<p style="color:var(--mut);margin-top:.5rem">${esc(rv.e)}</p></div>
      <div class="panel" style="display:flex;justify-content:space-between;align-items:center"><span>Sua pontuação</span><b class="disp" style="font-size:1.8rem">${score}</b></div>
      ${rk.me ? `<p style="text-align:center;color:var(--mut)">Você está em ${rk.me.rank}º de ${rk.total}</p>` : ''}`;
  } else if (ph === 'final') {
    const medal = rk.me ? ({1:'🥇',2:'🥈',3:'🥉'}[rk.me.rank] || '🏁') : '🏁';
    body = `<div class="center"><div class="em">${medal}</div><h2>Fim de jogo!</h2>
      ${rk.me ? `<p style="font-size:1.3rem">Você ficou em <b>${rk.me.rank}º lugar</b> de ${rk.total}</p>` : ''}
      <p class="disp" style="font-size:2.4rem;margin-top:.5rem">${score} pts</p><p style="color:var(--mut);margin-top:.6rem">Obrigado por jogar!</p></div>`;
  }
  app.innerHTML = `<div class="pl">${top}${body}</div>`;
  app.querySelectorAll('.tile[data-c]').forEach(b => b.onclick = () => submitAnswer(+b.dataset.c));
}

/* ===================== Relógio (cronômetro compartilhado) ===================== */
setInterval(() => {
  if (H && H.state && H.state.phase === 'question') {
    const st = H.state, ms = st.endsAt - now(), t = $('hTimer');
    if (t) { t.textContent = Math.max(0, Math.ceil(ms/1000)); t.classList.toggle('warn', ms <= 5000); }
    if ($('hTbar')) $('hTbar').style.width = clamp(ms / (st.duration*1000) * 100, 0, 100) + '%';
    if (ms <= -1200 && !H.closing) { H.closing = true; closeRound(); }
  }
  if (P && P.state && P.state.phase === 'question') {
    const st = P.state, ms = st.endsAt - now(), t = $('pTimer');
    if (t) t.textContent = Math.max(0, Math.ceil(ms/1000));
    if ($('pBar')) $('pBar').style.width = clamp(ms / (st.duration*1000) * 100, 0, 100) + '%';
    if (ms <= 0 && !P.expired && myAnswer() == null) { P.expired = true; renderPlayer(); }
  }
}, 250);

renderHome();
</script>
</body>
</html>
